<!--使用python实现的runlike转换实现-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">docker inspect to docker run</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .modal-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: white;
            border-radius: 10px;
            width: 90%;
            max-width: 80vw;
            max-height: 80vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-body {
            padding: 20px;
        }

        .modal-textarea {
            width: 100%;
            height: 50vh;
            padding: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
            line-height: 1.5;
        }

        .modal-textarea:focus {
            border-color: #409eff;
        }

        .modal-textarea::placeholder {
            color: #909399;
        }

        .modal-footer {
            padding: 16px 20px;
            background-color: #f5f7fa;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            padding: 10px 24px;
            font-size: 14px;
            background-color: #fff;
            color: #606266;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background-color: #f5f7fa;
        }

        .btn-confirm {
            padding: 10px 24px;
            font-size: 14px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-confirm:hover {
            background-color: #66b1ff;
        }

        .result-container {
            display: none;
            margin-top: 20px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #303133;
        }

        .result-textarea {
            width: 100%;
            min-height: 50vh;
            padding: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            background-color: #fafafa;
            resize: vertical;
            outline: none;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn-copy {
            margin-top: 10px;
            padding: 8px 20px;
            font-size: 14px;
            background-color: #67c23a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-copy:hover {
            background-color: #85ce61;
        }

        .copy-success {
            color: #67c23a;
            margin-left: 10px;
            font-size: 14px;
            display: none;
        }

        .error-message {
            color: #f56c6c;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-body">
                <textarea 
                    class="modal-textarea" 
                    id="inputText" 
                    data-i18n-placeholder="placeholder"
                ></textarea>
                <div class="error-message" id="errorMessage" data-i18n="errorJsonParse"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideModal()" data-i18n="cancel"></button>
                <button class="btn-confirm" onclick="handleConfirm()" data-i18n="confirm"></button>
            </div>
        </div>
    </div>

    <div class="result-container" id="resultContainer">
        <div class="result-title" data-i18n="resultTitle"></div>
        <textarea class="result-textarea" id="resultText" readonly></textarea>
        <div>
            <button class="btn-copy" onclick="copyResult()" data-i18n="copy"></button>
            <span class="copy-success" id="copySuccess" data-i18n="copySuccess"></span>
            <button class="btn-cancel" style="margin-left: 10px;" onclick="showModal()" data-i18n="reInput"></button>
        </div>
    </div>

    <script>
        const i18n = {
            zh: {
                title: 'docker inspect 转换为 docker run',
                placeholder: '请输入`docker inspect $container_id_or_name` 的输出文本',
                cancel: '取消',
                confirm: '确认转换',
                resultTitle: '生成的 docker run 命令：',
                copy: '复制命令',
                copySuccess: '✓ 已复制到剪贴板',
                reInput: '重新输入',
                errorJsonParse: 'JSON 格式解析失败，请检查输入内容',
                errorEmptyInput: '请输入 docker inspect 的输出内容',
                consoleOutput: '生成的 docker run 命令:',
                jsonParseError: 'JSON 解析失败'
            },
            en: {
                title: 'docker inspect to docker run',
                placeholder: 'Please enter the output of `docker inspect $container_id_or_name`',
                cancel: 'Cancel',
                confirm: 'Convert',
                resultTitle: 'Generated docker run command:',
                copy: 'Copy Command',
                copySuccess: '✓ Copied to clipboard',
                reInput: 'Re-input',
                errorJsonParse: 'JSON parsing failed, please check the input',
                errorEmptyInput: 'Please enter the docker inspect output',
                consoleOutput: 'Generated docker run command:',
                jsonParseError: 'JSON parsing failed'
            }
        };

        function detectLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            return lang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        const currentLang = detectLanguage();

        function t(key) {
            return i18n[currentLang][key] || key;
        }

        function updateLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.value = t(key);
                } else {
                    el.textContent = t(key);
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });

            document.title = t('title');
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
        }

        class Inspector {
            constructor(rawJson) {
                try {
                    this.containerFacts = JSON.parse(rawJson);
                    if (Array.isArray(this.containerFacts)) {
                        this.containerFacts = this.containerFacts[0];
                    }
                } catch (e) {
                    throw new Error(t('jsonParseError'));
                }
                this.options = [];
                this.image = this.getContainerFact('Config.Image');
            }

            getContainerFact(path) {
                return this.getFact(path, this.containerFacts);
            }

            getFact(path, value) {
                if (!value) return null;
                const parts = path.split('.');
                for (const p of parts) {
                    if (value[p] === undefined) return null;
                    value = value[p];
                }
                return value;
            }

            quote(str) {
                if (!str) return str;
                return "'" + str.replace(/'/g, "'\\''") + "'";
            }

            parseHostname() {
                const hostname = this.getContainerFact('Config.Hostname');
                if (hostname) {
                    this.options.push(`--hostname=${hostname}`);
                }
            }

            parseUser() {
                const user = this.getContainerFact('Config.User');
                if (user && user !== '') {
                    this.options.push(`--user=${user}`);
                }
            }

            parseMacAddress() {
                try {
                    const macAddress = this.getContainerFact('Config.MacAddress') || 
                                       this.getContainerFact('NetworkSettings.MacAddress');
                    if (macAddress) {
                        this.options.push(`--mac-address=${macAddress}`);
                    }
                } catch (e) {
                }
            }

            parseIPv6() {
                const networks = this.getContainerFact('NetworkSettings.Networks') || {};
                for (const network of Object.values(networks)) {
                    if (network && network.IPAMConfig && network.IPAMConfig.IPv6Address) {
                        this.options.push(`--ip6=${network.IPAMConfig.IPv6Address}`);
                        break;
                    }
                }
            }

            parsePid() {
                const mode = this.getContainerFact('HostConfig.PidMode');
                if (mode && mode !== '') {
                    this.options.push(`--pid ${mode}`);
                }
            }

            parseCpuset() {
                const cpusetCpu = this.getContainerFact('HostConfig.CpusetCpus');
                if (cpusetCpu && cpusetCpu !== '') {
                    this.options.push(`--cpuset-cpus=${cpusetCpu}`);
                }
                const cpusetMem = this.getContainerFact('HostConfig.CpusetMems');
                if (cpusetMem && cpusetMem !== '') {
                    this.options.push(`--cpuset-mems=${cpusetMem}`);
                }
            }

            parseEntrypoint() {
                const entrypoints = this.getContainerFact('Config.Entrypoint') || [];
                if (entrypoints.length > 0) {
                    this.options.push(`--entrypoint ${this.quote(entrypoints[0])}`);
                }
            }

            parseVolumes() {
                const mounts = this.getContainerFact('Mounts') || [];
                for (const mount of mounts) {
                    let volumeFormat;
                    if (mount.Type === 'volume') {
                        volumeFormat = mount.Destination;
                    } else {
                        volumeFormat = `${mount.Source}:${mount.Destination}`;
                    }
                    if (!mount.RW) {
                        volumeFormat += ':ro';
                    }
                    this.options.push(`--volume ${volumeFormat}`);
                }
            }

            multiOption(path, option) {
                const values = this.getContainerFact(path) || [];
                for (const value of values) {
                    this.options.push(`--${option}=${this.quote(value)}`);
                }
            }

            parsePorts() {
                const ports = this.getContainerFact('NetworkSettings.Ports') || {};
                const portBindings = this.getContainerFact('HostConfig.PortBindings') || {};
                
                const allPorts = { ...ports, ...portBindings };

                for (const [containerPortAndProtocol, optionsLoop] of Object.entries(allPorts)) {
                    const [containerPort, protocol] = containerPortAndProtocol.split('/');
                    const protocolPart = protocol === 'tcp' ? '' : '/udp';
                    
                    if (!optionsLoop) {
                        this.options.push(`--expose=${containerPort}${protocolPart}`);
                    } else {
                        for (const host of optionsLoop) {
                            let optionPart = '-p ';
                            let hostPortPart = '';
                            let hostnamePart = '';

                            const hostIp = host.HostIp;
                            const hostPort = host.HostPort;

                            if (hostPort !== '0' && hostPort !== '') {
                                hostPortPart = `${hostPort}:`;
                            }

                            if (hostIp && hostIp !== '0.0.0.0' && hostIp !== '::' && hostIp !== '') {
                                hostnamePart = `${hostIp}:`;
                            }

                            this.options.push(`${optionPart}${hostnamePart}${hostPortPart}${containerPort}${protocolPart}`);
                        }
                    }
                }
            }

            parseLinks() {
                const links = this.getContainerFact('HostConfig.Links') || [];
                const linkOptions = new Set();
                for (const link of links) {
                    const [src, dst] = link.split(':');
                    const dstName = dst.split('/').pop();
                    const srcName = src.split('/').pop();
                    if (srcName !== dstName) {
                        linkOptions.add(`--link ${srcName}:${dstName}`);
                    } else {
                        linkOptions.add(`--link ${srcName}`);
                    }
                }
                this.options.push(...linkOptions);
            }

            parseRestart() {
                const restart = this.getContainerFact('HostConfig.RestartPolicy.Name');
                if (!restart || restart === 'no') return;
                
                let restartStr = restart;
                if (restart === 'on-failure') {
                    const maxRetries = this.getContainerFact('HostConfig.RestartPolicy.MaximumRetryCount');
                    if (maxRetries > 0) {
                        restartStr += `:${maxRetries}`;
                    }
                }
                this.options.push(`--restart=${restartStr}`);
            }

            parseDevices() {
                const devices = this.getContainerFact('HostConfig.Devices') || [];
                const deviceOptions = new Set();
                for (const deviceSpec of devices) {
                    const host = deviceSpec.PathOnHost;
                    const container = deviceSpec.PathInContainer;
                    const perms = deviceSpec.CgroupPermissions;
                    let spec = `${host}:${container}`;
                    if (perms !== 'rwm') {
                        spec += `:${perms}`;
                    }
                    deviceOptions.add(`--device ${spec}`);
                }
                this.options.push(...deviceOptions);
            }

            parseLabels() {
                const labels = this.getContainerFact('Config.Labels') || {};
                const labelOptions = new Set();
                for (const [key, value] of Object.entries(labels)) {
                    labelOptions.add(`--label='${key}=${value}'`);
                }
                this.options.push(...labelOptions);
            }

            parseLog() {
                const logType = this.getContainerFact('HostConfig.LogConfig.Type');
                const logOpts = this.getContainerFact('HostConfig.LogConfig.Config') || {};
                const logOptions = new Set();
                
                if (logType && logType !== 'json-file') {
                    logOptions.add(`--log-driver=${logType}`);
                }
                for (const [key, value] of Object.entries(logOpts)) {
                    logOptions.add(`--log-opt ${key}=${value}`);
                }
                this.options.push(...logOptions);
            }

            parseExtraHosts() {
                const hosts = this.getContainerFact('HostConfig.ExtraHosts') || [];
                for (const host of hosts) {
                    this.options.push(`--add-host ${host}`);
                }
            }

            parseWorkdir() {
                const workdir = this.getContainerFact('Config.WorkingDir');
                if (workdir) {
                    this.options.push(`--workdir=${workdir}`);
                }
            }

            parseRuntime() {
                const runtime = this.getContainerFact('HostConfig.Runtime');
                if (runtime) {
                    this.options.push(`--runtime=${runtime}`);
                }
            }

            parseShmSize() {
                const shmSize = this.getContainerFact('HostConfig.ShmSize');
                if (shmSize) {
                    this.options.push(`--shm-size="${shmSize}"`);
                }
            }

            parseMemory() {
                const memory = this.getContainerFact('HostConfig.Memory');
                if (memory) {
                    this.options.push(`--memory="${memory}"`);
                }
            }

            parseMemoryReservation() {
                const memoryReservation = this.getContainerFact('HostConfig.MemoryReservation');
                if (memoryReservation) {
                    this.options.push(`--memory-reservation="${memoryReservation}"`);
                }
            }

            parseNetworkMode() {
                const networkMode = this.getContainerFact('HostConfig.NetworkMode');
                if (networkMode && networkMode !== 'default') {
                    this.options.push(`--network=${networkMode}`);
                }
            }

            parsePrivileged() {
                const privileged = this.getContainerFact('HostConfig.Privileged');
                if (privileged) {
                    this.options.push('--privileged');
                }
            }

            parseDetach() {
                const stdoutAttached = this.getContainerFact('Config.AttachStdout');
                if (!stdoutAttached) {
                    this.options.push('--detach=true');
                }
            }

            parseTty() {
                const tty = this.getContainerFact('Config.Tty');
                if (tty) {
                    this.options.push('-t');
                }
            }

            parseAutoRemove() {
                const autoRemove = this.getContainerFact('HostConfig.AutoRemove');
                if (autoRemove) {
                    this.options.push('--rm');
                }
            }

            parseName() {
                const name = this.getContainerFact('Name');
                if (name) {
                    const nameWithoutSlash = name.split('/').pop();
                    this.options.push(`--name=${nameWithoutSlash}`);
                }
            }

            formatCli() {
                this.options = [];

                this.parseName();
                this.parseHostname();
                this.parseUser();
                this.parseMacAddress();
                this.parseIPv6();
                this.parsePid();
                this.parseCpuset();
                this.parseEntrypoint();
                this.parseVolumes();
                
                this.multiOption('Config.Env', 'env');
                this.multiOption('HostConfig.VolumesFrom', 'volumes-from');
                this.multiOption('HostConfig.CapAdd', 'cap-add');
                this.multiOption('HostConfig.CapDrop', 'cap-drop');
                this.multiOption('HostConfig.Dns', 'dns');
                
                this.parseNetworkMode();
                this.parsePrivileged();
                this.parseWorkdir();
                this.parsePorts();
                this.parseLinks();
                this.parseRestart();
                this.parseDevices();
                this.parseLabels();
                this.parseLog();
                this.parseExtraHosts();
                this.parseRuntime();
                this.parseShmSize();
                this.parseMemory();
                this.parseMemoryReservation();
                this.parseDetach();
                this.parseTty();
                this.parseAutoRemove();

                const parameters = [...this.options];
                if (this.image) {
                    parameters.push(this.image);
                }

                const cmdParts = this.getContainerFact('Config.Cmd');
                if (cmdParts && Array.isArray(cmdParts)) {
                    const quoted = cmdParts.map(p => this.quote(p).replace(/'"'"'/g, "\\'"));
                    parameters.push(quoted.join(' '));
                }

                return `docker run ${parameters.join(' \\\n\t')}`;
            }
        }

        function showModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('resultContainer').style.display = 'none';
        }

        function hideModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function handleConfirm() {
            const textarea = document.getElementById('inputText');
            const inputText = textarea.value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            errorMessage.style.display = 'none';

            if (!inputText) {
                errorMessage.textContent = t('errorEmptyInput');
                errorMessage.style.display = 'block';
                return;
            }

            try {
                const inspector = new Inspector(inputText);
                const dockerRunCommand = inspector.formatCli();
                
                resultText.value = dockerRunCommand;
                hideModal();
                resultContainer.style.display = 'block';
                
                console.log(t('consoleOutput'));
                console.log(dockerRunCommand);
                
            } catch (e) {
                errorMessage.textContent = e.message || t('errorJsonParse');
                errorMessage.style.display = 'block';
            }
        }

        function copyResult() {
            const resultText = document.getElementById('resultText');
            const copySuccess = document.getElementById('copySuccess');

            resultText.select();
            document.execCommand('copy');

            copySuccess.style.display = 'inline';
            setTimeout(() => {
                copySuccess.style.display = 'none';
            }, 2000);
        }

        window.addEventListener('click', function(event) {
            const overlay = document.getElementById('modalOverlay');
            if (event.target === overlay) {
                hideModal();
            }
        });

        updateLanguage();
    </script>
</body>
</html>
